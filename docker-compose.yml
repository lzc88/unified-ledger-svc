name: unified-ledger-svc

services:
  db:
    image: postgres:17
    ports:
      - "127.0.0.1:54322:5432"
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  pgdata:
